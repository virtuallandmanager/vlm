app = "vlm-worlds-router"
primary_region = "iad"

[env]
  ROUTER_DOMAIN = "worlds.vlm.gg"

[http_service]
  internal_port = 3000
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    # Fly sends its own Host here, which is not a world, so the router answers ok.
