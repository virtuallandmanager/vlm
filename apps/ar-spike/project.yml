name: VirviAR
options:
  bundleIdPrefix: io.virvi.ar
  deploymentTarget:
    iOS: "18.0"
    visionOS: "2.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    exactVersion: 0.5.15

targets:
  VirviAR-iOS:
    type: application
    platform: iOS
    sources: [Shared, iOS]
    dependencies:
      - package: GLTFKit2
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Virvi AR
        NSCameraUsageDescription: Virvi AR uses the camera to show your Virvi scene in augmented reality.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.virvi.ar.ios
        TARGETED_DEVICE_FAMILY: "1"

  VirviAR-visionOS:
    type: application
    platform: visionOS
    sources: [Shared, visionOS]
    dependencies:
      - package: GLTFKit2
    info:
      path: visionOS/Info.plist
      properties:
        CFBundleDisplayName: Virvi AR
        NSWorldSensingUsageDescription: Virvi AR uses world tracking to pin your Virvi scene to a spot in this room.
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.virvi.ar.visionos
        TARGETED_DEVICE_FAMILY: "7"

  VirviARTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared/Mapping.swift
      - Shared/ScenePlan.swift
      - Shared/MarkerReadings.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.virvi.ar.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VirviAR-iOS:
    build:
      targets:
        VirviAR-iOS: all
    test:
      targets: [VirviARTests]
  VirviAR-visionOS:
    build:
      targets:
        VirviAR-visionOS: all
