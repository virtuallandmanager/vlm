# The worker's only way out: a forward proxy on loopback that lets through the hosts in allowlist.txt and denies the
# rest. entrypoint.sh writes the filter and starts it; nftables lets no other user's traffic leave.
User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 100
Allow 127.0.0.1
Allow ::1
DisableViaHeader Yes
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
ConnectPort 443
