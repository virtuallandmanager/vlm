# apps/streaming/fly.toml — deploy from the repo root:
#   fly deploy . --config apps/streaming/fly.toml
app = "vlm-streaming"
primary_region = "iad"

[build]
  dockerfile = "apps/streaming/Dockerfile"

[env]
  RTMP_PORT = "1935"
  HTTP_PORT = "8000"
  OUTPUT_DIR = "/data/streams"
  VLM_API_URL = "https://api.vlm.gg"
  MAX_STREAMS = "4"

[mounts]
  source = "vlm_streams"
  destination = "/data"

# HLS playback: https://live.vlm.gg (Fly TLS)
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# RTMP ingest: rtmp://ingest.vlm.gg:1935 (raw TCP, needs the dedicated IPv4)
[[services]]
  protocol = "tcp"
  internal_port = 1935
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 1935

[[vm]]
  size = "performance-2x"
